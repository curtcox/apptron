name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/test.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.4.3
      contract-config: testing-contract.config.mjs
      base-url: http://127.0.0.1:4173/apptron/
      server-command: node scripts/serve.mjs
      browser-command: node tests/browser/ai.mjs && node tests/browser/ai.mjs && node tests/browser/ai.mjs && node tests/browser/ai.mjs && npx playwright test tests/browser/editor.spec.cjs tests/browser/legacy-links.spec.cjs tests/browser/security.spec.cjs tests/browser/isolation-spike.spec.cjs tests/browser/url-state.spec.cjs --project="$BROWSER" --project="$BROWSER-phone"
      gallery-command: node scripts/render-kit-gallery.mjs --check
  kit:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/kit-check.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.4.3
  boot:
    if: vars.APPTRON_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: node scripts/sync-runtime-lock.mjs
      - name: Download the release, or build the initial runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(node -p "JSON.parse(require('fs').readFileSync('runtime.lock')).release")
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            scripts/fetch-runtime.sh
          else
            scripts/build-runtime.sh
            commit=$(git -C upstream/apptron rev-parse HEAD)
            node scripts/runtime-manifest.mjs "runtime/$commit" --lock
          fi
      - name: Prepare verified runtime cache metadata for boot checks
        run: |
          node scripts/pin-runtime-assets.mjs
          node scripts/update-offline.mjs
      - run: APPTRON_BOOT=1 scripts/test-browser-container.sh tests/browser/boot.spec.cjs --project=chromium --max-failures=1
      - name: Prepare paired artifacts for isolation checks
        run: |
          npm run build -- --role vm --editor-origin http://127.0.0.1:4173 --vm-url http://127.0.0.1:4174/apptron/vm.html
          npm run build -- --role editor --editor-origin http://127.0.0.1:4173 --vm-url http://127.0.0.1:4174/apptron/vm.html --out .build/editor-site
      - name: Verify separate-origin VM artifacts
        env:
          APPTRON_BOOT: '1'
          APPTRON_EDITOR_SITE_DIR: .build/editor-site
          APPTRON_VM_SITE_DIR: .build/vm-site
        run: scripts/test-browser-container.sh tests/browser/isolation.spec.cjs --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: boot-failures
          path: test-results/

name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/test-browser-container.sh tests/browser/editor.spec.cjs tests/browser/security.spec.cjs tests/browser/isolation-spike.spec.cjs --project=${{ matrix.browser }} --project=${{ matrix.browser }}-phone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}
          path: test-results/
  boot:
    if: vars.APPTRON_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: npm ci
      - run: node scripts/sync-runtime-lock.mjs
      - name: Download the release, or build the initial runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=$(node -p "JSON.parse(require('fs').readFileSync('runtime.lock')).release")
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            scripts/fetch-runtime.sh
          else
            scripts/build-runtime.sh
            commit=$(git -C upstream/apptron rev-parse HEAD)
            node scripts/runtime-manifest.mjs "runtime/$commit" --lock
          fi
      - run: APPTRON_BOOT=1 scripts/test-browser-container.sh tests/browser/boot.spec.cjs --project=chromium
      - name: Prepare paired artifacts for isolation checks
        run: |
          npm run build -- --role vm --editor-origin http://127.0.0.1:4173 --vm-url http://127.0.0.1:4174/apptron/vm.html
          npm run build -- --role editor --editor-origin http://127.0.0.1:4173 --vm-url http://127.0.0.1:4174/apptron/vm.html --out .build/editor-site
      - name: Verify separate-origin VM artifacts
        env:
          APPTRON_BOOT: '1'
          APPTRON_EDITOR_SITE_DIR: .build/editor-site
          APPTRON_VM_SITE_DIR: .build/vm-site
        run: scripts/test-browser-container.sh tests/browser/isolation.spec.cjs --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: boot-failures
          path: test-results/

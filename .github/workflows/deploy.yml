name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Runtime]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  tests:
    if: vars.APPTRON_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/test.yml
  deploy:
    needs: tests
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/pages.yml@v2
    with:
      path: dist
      verify-marker: apptron-fragment-kit-v0.3.4
      stage-command: |
        npm ci
        scripts/fetch-runtime.sh
        node --input-type=module <<'JS'
        import {execFileSync} from 'node:child_process';
        const vmURL = ${{ toJSON(vars.APPTRON_VM_URL) }};
        const editorOrigin = ${{ toJSON(vars.APPTRON_EDITOR_ORIGIN) }};
        execFileSync('npm',['run','build'],{stdio:'inherit',env:{...process.env,APPTRON_VM_URL:vmURL ?? '',APPTRON_EDITOR_ORIGIN:editorOrigin ?? ''}});
        JS
